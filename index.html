<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Forecast Web App</title>

  <!-- Icons & fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.min.css"/>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sky-app">

    <header class="app-header">
      <div class="brand">Weather Forecast Web App</div>
      <div class="controls">
        <div class="search-box">
          <input id="qInput" placeholder="Enter city or town (e.g. Tokyo)" autocomplete="off"/>
          <button id="searchBtn" class="btn"><i class="fas fa-search"></i> Find</button>
        </div>
        <button id="locBtn" class="btn ghost" title="Use my location"><i class="fas fa-location-arrow"></i></button>
      </div>
    </header>

    <section class="panel current-panel">
      <div class="location-row">
        <div>
          <div id="placeLabel" class="place">—</div>
          <div id="dateLabel" class="meta">—</div>
        </div>
        <div class="updated" id="lastUpdated">Last updated: —</div>
      </div>

      <div class="main-weather">
        <div class="big-icon"><img id="iconImg" src="" alt="icon"/></div>

        <div class="temp-block">
          <div id="tempLabel" class="temp-value">--°</div>
          <div id="descLabel" class="desc">—</div>
          <div style="display:flex;gap:10px;margin-top:8px;">
            <div id="feelsBlock" class="meta">Feels: --</div>
            <div id="pressureBlock" class="meta">Pressure: --</div>
          </div>
        </div>
      </div>

      <div class="stats-grid" aria-hidden="false">
        <div class="stat"><i class="fas fa-wind"></i><div><div class="val" id="windVal">--</div><div class="lbl">Wind</div></div></div>
        <div class="stat"><i class="fas fa-tint"></i><div><div class="val" id="humVal">--</div><div class="lbl">Humidity</div></div></div>
        <div class="stat"><i class="fas fa-sun"></i><div><div class="val" id="uvVal">—</div><div class="lbl">UV index</div></div></div>
        <div class="stat"><i class="fas fa-thermometer-half"></i><div><div class="val" id="minmaxVal">—</div><div class="lbl">Min/Max</div></div></div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
        <div class="units">
          <button id="metricBtn" class="unit-btn active">°C</button>
          <button id="imperialBtn" class="unit-btn">°F</button>
        </div>
        <div style="font-size:0.85rem;color:var(--muted)">Tools: Leaflet · OpenWeather</div>
      </div>
    </section>

    <aside class="right-column">
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div style="font-weight:700">Hourly</div>
          <div class="meta" id="tzLabel">—</div>
        </div>
        <div id="hourList" class="hourly-scroll">
          <div class="loading"><div class="spinner"></div>Fetching hourly data…</div>
        </div>
      </div>

      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div style="font-weight:700">5-Day Forecast</div>
          <div class="meta">Overview</div>
        </div>
        <div id="dayList" style="display:flex;flex-direction:column;gap:8px;">
          <div class="loading"><div class="spinner"></div>Loading daily forecast…</div>
        </div>
      </div>

      <div class="panel map-wrap">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div style="font-weight:700">Map</div>
          <div class="meta">Interactive</div>
        </div>
        <div id="mapArea" style="height:100%;width:100%"></div>
      </div>
    </aside>

  </div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
